<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Orders — Sumnay Cosmetic</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .page-title { font-style: italic; font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: var(--space-md); }

  .order-card {
    background: var(--color-ivory-dim);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    margin-bottom: var(--space-md);
  }

  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: var(--space-sm);
    padding-bottom: var(--space-sm);
    border-bottom: 1px solid rgba(43,27,34,0.1);
  }

  .order-id { font-size: 0.82rem; color: var(--color-ink-soft); }

  .order-status {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
  }
  .status-pending { background: #EAD9B8; color: #6B4E1E; }
  .status-processing { background: #C9D9E8; color: #24476B; }
  .status-shipped { background: #D4C9E8; color: #4A2E6B; }
  .status-delivered { background: #D0E0C8; color: #2F4E22; }
  .status-cancelled { background: #E8C9C9; color: #6B2424; }

  .order-item-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 0.4rem 0;
    color: var(--color-ink-soft);
  }

  .order-total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 1px solid rgba(43,27,34,0.1);
  }

  .empty-state { text-align: center; padding: var(--space-xl) 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">Sumnay</a>
    <ul class="nav-links"><li><a href="products.html">Shop</a></li></ul>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn">Bag <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="container" style="padding-top: var(--space-lg); padding-bottom: var(--space-lg);">
  <h1 class="page-title">Your orders</h1>
  <div id="orders-content">
    <!-- Rendered by JS -->
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p style="opacity:0.6; font-size:0.85rem;">&copy; 2026 Sumnay Cosmetic. Final year project.</p>
  </div>
</footer>

<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script src="../js/orders.js"></script>
</body>
</html>
