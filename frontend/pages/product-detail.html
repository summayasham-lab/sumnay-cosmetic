<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Sumnay Cosmetic</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .detail-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-lg);
    padding: var(--space-lg) 0;
    align-items: flex-start;
  }

  .detail-image {
    background: var(--color-ivory-dim);
    border-radius: var(--radius-md);
    aspect-ratio: 4 / 5;
    overflow: hidden;
    position: sticky;
    top: 100px;
  }

  .detail-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .detail-category {
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-ink-soft);
  }

  .detail-name {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(2rem, 4vw, 2.8rem);
    margin: 0.6rem 0 1rem;
  }

  .detail-price {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--color-plum);
    margin-bottom: var(--space-md);
  }

  .detail-desc {
    line-height: 1.7;
    color: var(--color-ink-soft);
    margin-bottom: var(--space-md);
    max-width: 48ch;
  }

  .shade-block {
    margin-bottom: var(--space-md);
  }

  .shade-block h4 {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-ink-soft);
    margin-bottom: 0.5rem;
  }

  .shade-swatch-large {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid var(--color-ivory);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: var(--space-md);
  }

  .qty-control {
    display: flex;
    align-items: center;
    border: 1px solid rgba(43,27,34,0.15);
    border-radius: var(--radius-sm);
  }

  .qty-control button {
    background: none;
    border: none;
    padding: 0.6rem 1rem;
    cursor: pointer;
    font-size: 1.1rem;
  }

  .qty-control span {
    padding: 0 1rem;
    min-width: 2ch;
    text-align: center;
  }

  .stock-note {
    font-size: 0.85rem;
    color: var(--color-sage);
    margin-bottom: var(--space-md);
  }

  .added-toast {
    display: none;
    background: var(--color-plum);
    color: var(--color-cream-text);
    padding: 0.8rem 1.2rem;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    margin-top: 1rem;
  }

  .added-toast.show { display: block; }

  .recommendations-section {
    padding: var(--space-lg) 0 var(--space-xl);
    border-top: 1px solid rgba(43,27,34,0.08);
    margin-top: var(--space-lg);
  }

  .recs-title {
    font-style: italic;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    margin-bottom: var(--space-md);
  }

  .recs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-md);
  }

  .recs-grid .product-image {
    aspect-ratio: 4 / 5;
    padding: 0;
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  @media (max-width: 860px) {
    .recs-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 860px) {
    .detail-layout { grid-template-columns: 1fr; }
    .detail-image { position: static; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">Sumnay</a>
    <ul class="nav-links">
      <li><a href="products.html">Shop</a></li>
      <li><a href="products.html?category=Skincare">Skincare</a></li>
      <li><a href="products.html?category=Haircare">Haircare</a></li>
      <li><a href="products.html?category=Fragrance">Fragrance</a></li>
    </ul>
    <div class="nav-actions">
      <a href="orders.html" class="icon-btn">Orders</a>
      <a href="login.html" class="icon-btn">Account</a>
      <a href="cart.html" class="icon-btn">Bag <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <div class="detail-layout" id="detail-layout">
    <!-- Rendered by JS -->
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p style="opacity:0.6; font-size:0.85rem;">&copy; 2026 Sumnay Cosmetic. Final year project.</p>
  </div>
</footer>

<script src="../js/products-data.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/product-detail.js"></script>
</body>
</html>
