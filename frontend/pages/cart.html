<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — Sumnay Cosmetic</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .cart-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: var(--space-lg);
    padding: var(--space-lg) 0;
    align-items: flex-start;
  }

  .page-title {
    font-style: italic;
    font-size: clamp(2rem, 4vw, 2.8rem);
    margin-bottom: var(--space-md);
  }

  .cart-item {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: var(--space-sm);
    align-items: center;
    padding: var(--space-sm) 0;
    border-bottom: 1px solid rgba(43,27,34,0.08);
  }

  .cart-item img {
    width: 90px;
    height: 100px;
    object-fit: cover;
    border-radius: var(--radius-sm);
  }

  .cart-item-name {
    font-family: var(--font-display);
    font-weight: 600;
    margin-bottom: 0.3rem;
  }

  .cart-item-category {
    font-size: 0.78rem;
    color: var(--color-ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .cart-item-qty {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.5rem;
  }

  .qty-control {
    display: flex;
    align-items: center;
    border: 1px solid rgba(43,27,34,0.15);
    border-radius: var(--radius-sm);
  }

  .qty-control button {
    background: none;
    border: none;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
  }

  .qty-control span { padding: 0 0.6rem; }

  .remove-link {
    font-size: 0.8rem;
    color: var(--color-ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .cart-item-total {
    font-weight: 700;
    color: var(--color-plum);
    text-align: right;
  }

  .summary-box {
    background: var(--color-ivory-dim);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    position: sticky;
    top: 100px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.7rem;
    font-size: 0.95rem;
  }

  .summary-total {
    font-weight: 700;
    font-size: 1.15rem;
    border-top: 1px solid rgba(43,27,34,0.1);
    padding-top: 0.8rem;
    margin-top: 0.5rem;
  }

  .empty-cart {
    text-align: center;
    padding: var(--space-xl) 0;
  }

  @media (max-width: 860px) {
    .cart-layout { grid-template-columns: 1fr; }
    .summary-box { position: static; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-logo">Sumnay</a>
    <ul class="nav-links">
      <li><a href="products.html">Shop</a></li>
      <li><a href="products.html?category=Skincare">Skincare</a></li>
      <li><a href="products.html?category=Haircare">Haircare</a></li>
      <li><a href="products.html?category=Fragrance">Fragrance</a></li>
    </ul>
    <div class="nav-actions">
      <a href="orders.html" class="icon-btn">Orders</a>
      <a href="login.html" class="icon-btn">Account</a>
      <a href="cart.html" class="icon-btn">Bag <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <h1 class="page-title">Your bag</h1>
  <div id="cart-content">
    <!-- Rendered by JS -->
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p style="opacity:0.6; font-size:0.85rem;">&copy; 2026 Sumnay Cosmetic. Final year project.</p>
  </div>
</footer>

<script src="../js/products-data.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/cart-page.js"></script>
</body>
</html>
